<meta charset="utf-8">
<!-- CSP estricta: sin conexiones externas, sin eval. Si tu app necesita hablar
     con una API, agregá su origen a connect-src y nada más. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Idiolect</title>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/motion.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/controls.css">
<link rel="stylesheet" href="./css/surfaces.css">
<link rel="stylesheet" href="./css/overlays.css">
<link rel="stylesheet" href="./css/idiolect.css">

<style>
  /* Boot splash: réplica exacta del primer frame. Pinta ANTES de que cargue
     ningún módulo, así no hay un solo instante sin identidad en pantalla.
     El color tiene que ser el mismo backgroundColor de la BrowserWindow —
     literal, no una variable: los tokens todavía podrían no haber cargado. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: #0b0b0d;
    transition: opacity .34s cubic-bezier(.16, 1, .3, 1);
  }
  #boot-splash svg { width: 46px; height: 46px; stroke: #f2f4f7; fill: none;
                     stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
  /* La marca se DIBUJA, no aparece: el globo primero, la virgulilla detrás. */
  #boot-splash path { stroke-dasharray: 50; stroke-dashoffset: 50;
                      animation: boot-draw .72s cubic-bezier(.16,1,.3,1) forwards; }
  #boot-splash path:last-child { stroke-dasharray: 9; stroke-dashoffset: 9;
                                 opacity: .34; animation-delay: .1s; }
  @keyframes boot-draw { to { stroke-dashoffset: 0 } }
</style>

<div id="boot-splash">
  <svg viewBox="0 0 16 16">
    <path d="M3.6 2.6h8.8A1.6 1.6 0 0 1 14 4.2v5.4a1.6 1.6 0 0 1-1.6 1.6H7.4l-3 2.6v-2.6h-.8A1.6 1.6 0 0 1 2 9.6V4.2a1.6 1.6 0 0 1 1.6-1.6z"/>
    <path d="M5.1 7.3c.9-1.1 1.9-1.1 2.9-.3s2 .8 2.9-.3"/>
  </svg>
</div>

<div class="ox-app">

  <!-- ── Titlebar propia: acá no hay frame nativo ─────────────────────────── -->
  <header class="ox-titlebar">
    <div class="ox-brand ox-no-drag" data-tip="Idiolect" id="brand">
      <svg class="ox-brand__mark ox-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.6 2.6h8.8A1.6 1.6 0 0 1 14 4.2v5.4a1.6 1.6 0 0 1-1.6 1.6H7.4l-3 2.6v-2.6h-.8A1.6 1.6 0 0 1 2 9.6V4.2a1.6 1.6 0 0 1 1.6-1.6z"/>
        <path class="ox-brand__trail" d="M5.1 7.3c.9-1.1 1.9-1.1 2.9-.3s2 .8 2.9-.3"/>
      </svg>
      <span class="ox-brand__name">Idiolect</span>
    </div>

    <!-- Contexto de la vista actual. Lo llena el router. -->
    <div class="ox-titlebar__context" id="titlebar-context"></div>

    <div class="ox-wincontrols">
      <button class="ox-wincontrol" id="win-min"   aria-label="Minimizar"><i data-icon="winMin"></i></button>
      <button class="ox-wincontrol" id="win-max"   aria-label="Maximizar"><i data-icon="winMax"></i></button>
      <button class="ox-wincontrol ox-wincontrol--close" id="win-close" aria-label="Cerrar"><i data-icon="winClose"></i></button>
    </div>
  </header>

  <div class="ox-body">

    <!-- ── Rail ──────────────────────────────────────────────────────────── -->
    <nav class="ox-rail">
      <div class="ox-rail__top">
        <button class="ox-btn ox-btn--secondary ox-flashable" id="btn-new" style="width:100%"
                data-tip="Ctrl+N" data-tip-side="right">
          <i data-icon="plus"></i> Nueva expresión
        </button>
      </div>

      <div class="ox-rail__nav ox-scroll">
        <div class="ox-rail__group">
          <button class="ox-navitem" data-view="glosario">
            <i data-icon="book"></i> Glosario <span class="ox-navitem__count" id="count-todas">0</span>
          </button>
          <button class="ox-navitem" data-view="revisar">
            <i data-icon="review"></i> Por revisar <span class="ox-navitem__count" id="count-revisar">0</span>
          </button>
        </div>

        <div class="ox-rail__group">
          <div class="ox-rail__group-label">Sistema</div>
          <button class="ox-navitem" data-view="ajustes">
            <i data-icon="settings"></i> Ajustes
          </button>
        </div>
      </div>

      <div class="ox-rail__foot" id="rail-foot"></div>
    </nav>

    <!-- ── Vista ─────────────────────────────────────────────────────────── -->
    <main class="ox-main" id="view"></main>
  </div>

  <!-- ── Statusbar ───────────────────────────────────────────────────────── -->
  <footer class="ox-statusbar">
    <div class="ox-statusbar__item" data-tip="Entradas en el glosario" data-tip-side="top">
      <i data-icon="book"></i> <span class="ox-statusbar__value ox-num" id="stat-total">0</span> expresiones
    </div>
    <div class="ox-statusbar__item" data-tip="Borradores que todavía no confirmaste" data-tip-side="top">
      <i data-icon="review"></i> <span class="ox-statusbar__value ox-num" id="stat-revisar">0</span> sin confirmar
    </div>
    <div class="ox-spacer"></div>
    <div class="ox-statusbar__item id-version" id="stat-version" data-tip="Buscar actualizaciones" data-tip-side="top" role="button" tabindex="0">
      <span class="ox-statusbar__value">—</span>
    </div>
    <div class="ox-statusbar__item" id="stat-saved" data-tip="Última vez que se regeneró glosario.md" data-tip-side="top">
      <i data-icon="save"></i> glosario.md <span class="ox-statusbar__value">—</span>
    </div>
  </footer>
</div>

<!-- Todos los overlays se portalean acá: fuera del flujo, por encima de todo. -->
<div id="ox-layer"></div>

<script type="module" src="./js/app.js"></script>
